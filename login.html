<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This is Drafted´s login page" />
    <title>Drafted | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <main>
      <form id="login-form">
        <a href="./index.html" aria-label="Go to homepage">
          <img
            src="./images/drafted-logo.png"
            alt="Drafted logo"
            class="logo"
          />
        </a>

        <p class="subtitle">Log in to your account to continue publishing</p>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit">Login</button>
      </form>

      <p class="auth-link">
        Don't have an account?
        <a href="./register.html">Register</a>
      </p>
      <p id="message"></p>
    </main>

    <script type="module" src="./js/login.js"></script>
  </body>
</html>
